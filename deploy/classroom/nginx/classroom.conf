worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format classroom_safe '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" $status $body_bytes_sent';

    access_log /dev/stdout classroom_safe;
    error_log /dev/stderr crit;

    upstream classroom_sync {
        server sync-api:8080;
        keepalive 8;
    }

    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 2m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;

        location ~ ^/classroom-api/v1/classrooms/[^/]+/events$ {
            rewrite ^/classroom-api/(.*)$ /$1 break;
            proxy_pass http://classroom_sync;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /classroom-api/ {
            rewrite ^/classroom-api/(.*)$ /$1 break;
            proxy_pass http://classroom_sync;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location / {
            return 404;
        }
    }
}
