name: classroom-remote-development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classroom_remote_development
      POSTGRES_USER: classroom_remote_development
      POSTGRES_PASSWORD: local-remote-development-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom_remote_development -d classroom_remote_development"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - classroom-remote-development-postgres:/var/lib/postgresql/data
    networks: [classroom-remote-development]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-remote-development-access
      MINIO_ROOT_PASSWORD: local-remote-development-secret
    volumes:
      - classroom-remote-development-minio:/data
    networks: [classroom-remote-development]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 local-remote-development-access local-remote-development-secret; do sleep 1; done
        mc mb --ignore-existing local/classroom-evidence
        mc anonymous set none local/classroom-evidence
    networks: [classroom-remote-development]

  sync-api:
    image: classroom-remote-development-sync-api:latest
    build:
      context: ../../..
      dockerfile: services/classroom-sync/Dockerfile
    command: ["/bin/sh", "-ec", "alembic upgrade head && python -m classroom_sync.serve"]
    environment: &classroom-runtime
      CLASSROOM_DATABASE_URL: postgresql+psycopg://classroom_remote_development:local-remote-development-password@postgres:5432/classroom_remote_development
      CLASSROOM_S3_ENDPOINT_URL: http://minio:9000
      CLASSROOM_S3_BUCKET: classroom-evidence
      CLASSROOM_S3_ACCESS_KEY: local-remote-development-access
      CLASSROOM_S3_SECRET_KEY: local-remote-development-secret
      CLASSROOM_FINCOLAB_BASE_URL: ${CLASSROOM_FINCOLAB_BASE_URL:?configure CLASSROOM_FINCOLAB_BASE_URL in the local env file}
      CLASSROOM_FINCOLAB_ORGANIZATION_ID: ${CLASSROOM_FINCOLAB_ORGANIZATION_ID:?configure CLASSROOM_FINCOLAB_ORGANIZATION_ID in the local env file}
      CLASSROOM_PLUGIN_JWT_SECRET: ${CLASSROOM_PLUGIN_JWT_SECRET:?configure CLASSROOM_PLUGIN_JWT_SECRET in the local env file}
      CLASSROOM_API_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18083:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [classroom-remote-development]

  deadline-worker:
    image: classroom-remote-development-deadline-worker:latest
    build:
      context: ../../..
      dockerfile: services/classroom-sync/Dockerfile
    command: ["python", "-m", "classroom_sync.worker_main"]
    environment:
      <<: *classroom-runtime
      CLASSROOM_DEADLINE_POLL_SECONDS: "5"
      CLASSROOM_WORKER_ID: classroom-remote-development-worker
    depends_on:
      sync-api:
        condition: service_healthy
    networks: [classroom-remote-development]

networks:
  classroom-remote-development:
    name: classroom-remote-development-network

volumes:
  classroom-remote-development-postgres:
    name: classroom-remote-development-postgres
  classroom-remote-development-minio:
    name: classroom-remote-development-minio
