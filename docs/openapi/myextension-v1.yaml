openapi: 3.1.0
info:
  title: MyExtension Pilot API
  version: 1.1.0
  description: Profile v2 adds teacher-confirmed question, knowledge-point, and structured-test authoring. Assessment-assist responses remain editable suggestions and do not create mastery conclusions.
security: [{ JupyterServerAuth: [] }]
paths:
  /myextension/platform/context:
    get:
      operationId: getPlatformContext
      description: Server-authoritative local or classroom-student capability context. Student snapshots never expose plugin credentials.
      security: [{ JupyterServerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/PlatformContextResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: refreshPlatformContext
      description: Refreshes only a locally stored classroom session. Plugin credentials remain private to the Jupyter server process.
      security: [{ JupyterServerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/PlatformContextResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /myextension/dimension-templates:
    get:
      operationId: listDimensionTemplates
      security: [{ JupyterServerAuth: [] }]
      responses: &template_list
        '200': { $ref: '#/components/responses/TemplateListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/dimension-profiles:
    get:
      operationId: listDimensionProfiles
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProblemId' }]
      responses: &profile_list
        '200': { $ref: '#/components/responses/ProfileListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: createDimensionProfile
      security: [{ JupyterServerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProfileDraft' }
      responses: &profile_draft
        '201': { $ref: '#/components/responses/ProfileDraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/dimension-profiles/{profile_id}/draft:
    put:
      operationId: updateDimensionProfileDraft
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      requestBody: { $ref: '#/components/requestBodies/ProfileDraftUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ProfileDraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/dimension-profiles/{profile_id}/publish:
    post:
      operationId: publishDimensionProfile
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses: &profile_version
        '200': { $ref: '#/components/responses/ProfileVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/dimension-profiles/{profile_id}/versions/{version}:
    get:
      operationId: getDimensionProfileVersion
      security: [{ JupyterServerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/ProfileId' },
          { $ref: '#/components/parameters/Version' }
        ]
      responses: *profile_version
  /myextension/assessment-assist/knowledge-points:
    post:
      operationId: recommendAssessmentKnowledgePoints
      description: Recommends editable knowledge-point candidates from teacher-authored problem context only. The response is not persisted or confirmed automatically.
      security: [{ JupyterServerAuth: [] }]
      requestBody:
        { $ref: '#/components/requestBodies/AssessmentKnowledgeRequest' }
      responses:
        '200': { $ref: '#/components/responses/AssessmentKnowledgeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /myextension/assessment-assist/tests:
    post:
      operationId: generateAssessmentTests
      description: Generates editable structured test candidates from teacher-authored problem context and confirmed knowledge points. The response is not persisted or confirmed automatically.
      security: [{ JupyterServerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AssessmentTestsRequest' }
      responses:
        '200': { $ref: '#/components/responses/AssessmentTestsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /myextension/log-folder/open:
    post:
      operationId: openLogFolder
      description: Opens the fixed local sessions folder on the Jupyter Server machine without returning its path.
      security: [{ JupyterServerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/LogFolderOpen' }
      responses:
        '200': { $ref: '#/components/responses/LogFolderOpenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/start:
    post:
      operationId: startSession
      security: [{ JupyterServerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/SessionStart' }
      responses: &session_start
        '201': { $ref: '#/components/responses/SessionStartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/segments:
    post:
      operationId: appendSessionSegments
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody: { $ref: '#/components/requestBodies/SegmentBatch' }
      responses: &segment_receipt
        '202': { $ref: '#/components/responses/SegmentReceiptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/finalize:
    post:
      operationId: finalizeSession
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody: { $ref: '#/components/requestBodies/SessionFinalize' }
      responses: &session_finalize
        '202': { $ref: '#/components/responses/SessionFinalizeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/logs:
    get:
      operationId: listSessionLogs
      description: Returns the fixed operation, process, and analysis log states for one session.
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { $ref: '#/components/responses/SessionLogListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/brief:
    get:
      operationId: getClassroomBrief
      description: Returns the private-safe deterministic local classroom brief for a terminal session.
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { $ref: '#/components/responses/ClassroomBriefResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/logs/{kind}:
    get:
      operationId: viewSessionLog
      description: Returns one bounded UTF-8 log for read-only in-product viewing.
      security: [{ JupyterServerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/SessionId' },
          { $ref: '#/components/parameters/SessionLogKind' }
        ]
      responses:
        '200':
          {
            description: Session log content.,
            content:
              {
                application/json: { schema: { type: object } },
                text/markdown: { schema: { type: string } }
              }
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/logs/{kind}/download:
    get:
      operationId: downloadSessionLog
      description: Downloads the complete allowlisted session log as an attachment.
      security: [{ JupyterServerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/SessionId' },
          { $ref: '#/components/parameters/SessionLogKind' }
        ]
      responses:
        '200':
          {
            description: Complete session log file with its native media type.,
            content:
              {
                application/json: { schema: { type: string, format: binary } },
                text/markdown: { schema: { type: string, format: binary } }
              }
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/abandon:
    post:
      operationId: abandonSession
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody: { $ref: '#/components/requestBodies/SessionAbandon' }
      responses: &session_state
        '200': { $ref: '#/components/responses/SessionStateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/recover:
    post:
      operationId: recoverSession
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody: { $ref: '#/components/requestBodies/SessionRecover' }
      responses: *session_state
  /myextension/sessions/{session_id}:
    get:
      operationId: getSession
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses: *session_state
    delete:
      operationId: deleteSession
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody: { $ref: '#/components/requestBodies/SessionDelete' }
      responses: &session_delete
        '200': { $ref: '#/components/responses/DeletedSessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/analysis-jobs/{job_id}:
    get:
      operationId: getAnalysisJob
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses: &analysis_job
        '200': { $ref: '#/components/responses/AnalysisJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/analysis-jobs/{job_id}/retry:
    post:
      operationId: retryAnalysisJob
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      requestBody: { $ref: '#/components/requestBodies/AnalysisRetry' }
      responses: *analysis_job
  /myextension/sessions/{session_id}/analysis:
    get:
      operationId: getSessionAnalysis
      security: [{ JupyterServerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { $ref: '#/components/responses/SessionAnalysisResponse' }
        '202': { $ref: '#/components/responses/AnalysisJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /myextension/sessions/{session_id}/analysis/{dimension_code}/review:
    patch:
      operationId: reviewSessionDimensionAnalysis
      security: [{ JupyterServerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/SessionId' },
          { $ref: '#/components/parameters/DimensionCode' }
        ]
      requestBody: { $ref: '#/components/requestBodies/DimensionReview' }
      responses: &dimension_result
        '200': { $ref: '#/components/responses/DimensionResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    JupyterServerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Use Jupyter token <value> in Authorization; same-origin login cookies are server-managed.
  parameters:
    ProblemId:
      {
        name: problem_id,
        in: query,
        required: false,
        schema: { type: string, minLength: 1, maxLength: 200 }
      }
    ProfileId:
      {
        name: profile_id,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/Uuid' }
      }
    Version:
      {
        name: version,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1 }
      }
    SessionId:
      {
        name: session_id,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/CanonicalUuid' }
      }
    SessionLogKind:
      {
        name: kind,
        in: path,
        required: true,
        schema: { enum: [operation, process, analysis] }
      }
    JobId:
      {
        name: job_id,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/Uuid' }
      }
    DimensionCode:
      {
        name: dimension_code,
        in: path,
        required: true,
        schema: { type: string, minLength: 1 }
      }
  schemas:
    Error: { $ref: '../../myextension/api_schemas/error-v1.json' }
    ProfileDraftV1:
      { $ref: '../../myextension/api_schemas/profile-draft-v1.json' }
    ProfileDraftV2:
      { $ref: '../../myextension/api_schemas/profile-draft-v2.json' }
    ProfileDraft:
      oneOf:
        - { $ref: '#/components/schemas/ProfileDraftV1' }
        - { $ref: '#/components/schemas/ProfileDraftV2' }
    ProfileVersionV1:
      { $ref: '../../myextension/api_schemas/profile-version-v1.json' }
    ProfileVersionV2:
      { $ref: '../../myextension/api_schemas/profile-version-v2.json' }
    ProfileVersion:
      oneOf:
        - { $ref: '#/components/schemas/ProfileVersionV1' }
        - { $ref: '#/components/schemas/ProfileVersionV2' }
    AssessmentKnowledgeRequest:
      {
        $ref: '../../myextension/api_schemas/assessment-knowledge-request-v1.json'
      }
    AssessmentKnowledgeResponse:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, knowledge_points]
      properties:
        schema_version: { const: 1 }
        request_id: { $ref: '#/components/schemas/Uuid' }
        knowledge_points:
          {
            $ref: '../../myextension/api_schemas/assessment-knowledge-response-v1.json#/properties/knowledge_points'
          }
    AssessmentTestsRequest:
      { $ref: '../../myextension/api_schemas/assessment-tests-request-v1.json' }
    AssessmentTestsResponse:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, assessment_tests]
      properties:
        schema_version: { const: 1 }
        request_id: { $ref: '#/components/schemas/Uuid' }
        assessment_tests:
          {
            $ref: '../../myextension/api_schemas/assessment-tests-response-v1.json#/properties/assessment_tests'
          }
    LogFolderOpenResponse:
      { $ref: '../../myextension/api_schemas/log-folder-open-response-v1.json' }
    SessionLogListResponse:
      {
        $ref: '../../myextension/api_schemas/session-log-list-response-v1.json'
      }
    ClassroomBriefResponse:
      { $ref: '../../myextension/api_schemas/classroom-brief-response-v1.json' }
    PlatformContextResponse:
      {
        $ref: '../../myextension/api_schemas/platform-context-response-v1.json'
      }
    SessionStart:
      { $ref: '../../myextension/api_schemas/session-start-v1.json' }
    SegmentBatch:
      { $ref: '../../myextension/api_schemas/segment-batch-v1.json' }
    DimensionResult:
