              type: [string, 'null'],
              enum:
                [ai_not_configured, ai_analysis_failed, invalid_profile, null]
            },
          dimension_results:
            {
              type: array,
              minItems: 1,
              maxItems: 10,
              items: { $ref: '#/components/schemas/DimensionResult' }
            },
          provenance: { $ref: '#/components/schemas/Provenance' }
        }
    DimensionResultResponse:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, dimension_code, decision]
      properties:
        {
          schema_version: { const: 1 },
          request_id: { type: string, minLength: 1 },
          dimension_code: { type: string, minLength: 1 },
          decision: { $ref: '#/components/schemas/Decision' },
          data_quality:
            {
              $ref: '../../myextension/api_schemas/dimension-result-v1.json#/$defs/data_quality'
            },
          ai_result:
            {
              $ref: '../../myextension/api_schemas/dimension-result-v1.json#/$defs/ai_result'
            },
          review:
            {
              $ref: '../../myextension/api_schemas/dimension-result-v1.json#/$defs/review'
            }
        }
      allOf:
        [
          {
            if:
              {
                properties:
                  {
                    decision:
                      {
                        properties:
                          { final_evidence_status: { const: observed } },
                        required: [final_evidence_status]
                      }
                  },
                required: [decision]
              },
            then:
              {
                required: [ai_result],
                properties:
                  {
                    ai_result:
                      {
                        type: object,
                        properties: { evidence_claims: { minItems: 1 } },
                        required: [evidence_claims]
                      }
                  }
              }
          }
        ]
